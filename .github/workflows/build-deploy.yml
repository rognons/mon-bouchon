name: 🚀 Build & Deploy

on:
  workflow_run:
    workflows: ["🔍 Quality Check"]
    types:
      - completed
    branches:
      - master

env:
  REGISTRY: europe-west1-docker.pkg.dev
  PROJECT_ID: rognons
  REPOSITORY: docker
  IMAGE_PREFIX: europe-west1-docker.pkg.dev/rognons/docker

jobs:
  check-quality-success:
    name: ✅ Verify Quality Check
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 📊 Quality Check Status
        run: |
          echo "🎉 Quality check passed successfully!"
          echo "✅ Proceeding with build and deployment..."

  build-api:
    name: 🦕 Build API Image
    runs-on: ubuntu-latest
    needs: check-quality-success
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/517611743057/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github@rognons.iam.gserviceaccount.com

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/mon-bouchon_api
          tags: |
            type=sha
            type=raw,value=latest

      - name: 🏗️ Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-front:
    name: 🎨 Build Front Image
    runs-on: ubuntu-latest
    needs: check-quality-success
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/517611743057/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github@rognons.iam.gserviceaccount.com

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/mon-bouchon_front
          tags: |
            type=sha
            type=raw,value=latest

      - name: 🏗️ Build and push Front image
        id: build
        uses: docker/build-push-action@v6
        env:
          PUBLIC_API_URL: https://mon-bouchon-api.rognons.fr
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [check-quality-success, build-api, build-front, create-release]
    if: always()
    
    steps:
      - name: 📊 Show deployment info
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️ Built Images:" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: \`${{ needs.build-api.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Front**: \`${{ needs.build-front.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Registry:" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: \`${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.create-release.result }}" == "success" ]]; then
            echo "### 🏷️ Release:" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ GitHub Release created successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **View**: [📋 See release notes](https://github.com/${{ github.repository }}/releases/latest)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🏷️ Release:" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ❌ Failed to create GitHub Release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

  create-release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-api, build-front]
    if: ${{ needs.build-api.result == 'success' && needs.build-front.result == 'success' }}
    permissions:
      contents: write
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Generate release tag
        id: tag
        run: |
          # Generate tag based on date and commit SHA
          DATE=$(date +'%Y.%m.%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${DATE}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: 📝 Generate release notes
        id: notes
        run: |
          # Get commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -10)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
          fi
          
          # Extract and format API tags
          API_TAGS="${{ needs.build-api.outputs.image-tag }}"
          API_SHA_TAG=$(echo "$API_TAGS" | grep -E "sha-[a-f0-9]+" | head -1)
          API_LATEST_TAG=$(echo "$API_TAGS" | grep ":latest" | head -1)
          
          # Extract and format Frontend tags  
          FRONT_TAGS="${{ needs.build-front.outputs.image-tag }}"
          FRONT_SHA_TAG=$(echo "$FRONT_TAGS" | grep -E "sha-[a-f0-9]+" | head -1)
          FRONT_LATEST_TAG=$(echo "$FRONT_TAGS" | grep ":latest" | head -1)
          
          # Create release notes
          cat > release_notes.md << EOF
          ## 🏗️ Images Docker
          
          ### 🦕 API
          - **Version unique**: \`${API_SHA_TAG}\`
          - **Version latest**: \`${API_LATEST_TAG}\`
          
          ### 🎨 Frontend  
          - **Version unique**: \`${FRONT_SHA_TAG}\`
          - **Version latest**: \`${FRONT_LATEST_TAG}\`
          
          ## 📋 Changelog
          ${COMMITS}
          EOF

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 🚀 Release ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: false