name: 🔍 Quality Check

on:
  pull_request:
    branches:
      - master
    paths:
      - 'front/**'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - 'front/**'
      - '.github/workflows/**'

jobs:
  check-front:
    name: 🎨 Front Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🕵 Quality check
        run: npm run quality

      - name: 🐳 Build check
        run: npm run build

  quality-summary:
    name: ✅ Quality Summary
    runs-on: ubuntu-latest
    needs: [check-front]
    if: always()
    
    steps:
      - name: 📊 Check results
        run: |
          if [[ "${{ needs.check-front.result }}" == "success" ]]; then
            echo "✅ All quality checks passed!"
          else
            echo "❌ Some quality checks failed"
            exit 1
          fi
