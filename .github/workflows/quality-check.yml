name: 🔍 Quality Check

on:
  pull_request:
    branches:
      - master
    paths:
      - 'front/**'
      - 'api/**'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - 'front/**'
      - 'api/**'
      - '.github/workflows/**'

jobs:
  check-front:
    name: 🎨 Front Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20-alpine'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Check formatting
        run: npm run format:check

      - name: 🕵️ Run linter
        run: npm run lint

      - name: 🔍 TypeScript check
        run: npm run typecheck

      - name: 🏗️ Build check
        run: npm run build

  check-api:
    name: 🦕 API Quality  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
        
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.0.6

      - name: 📥 Cache dependencies
        run: deno cache main.ts

      - name: 🎨 Check formatting
        run: deno fmt --check

      - name: 🔍 Run linter
        run: deno lint

      - name: 🕵️ Type check
        run: deno check src/**/*.ts main.ts

      - name: 🧪 Run tests (if any)
        run: deno test --allow-net --allow-read || echo "No tests found"

  quality-summary:
    name: ✅ Quality Summary
    runs-on: ubuntu-latest
    needs: [check-front, check-api]
    if: always()
    
    steps:
      - name: 📊 Check results
        run: |
          if [[ "${{ needs.check-front.result }}" == "success" && "${{ needs.check-api.result }}" == "success" ]]; then
            echo "✅ All quality checks passed!"
          else
            echo "❌ Some quality checks failed"
            exit 1
          fi
