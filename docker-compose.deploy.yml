services:
  front:
    image: 'europe-west1-docker.pkg.dev/rognons/docker/mon-bouchon_front:latest'
    ports:
      - '3001:80'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost'
      interval: 5s
      timeout: 1s
    restart: unless-stopped
networks:
  default:
    name: mon-rognon
