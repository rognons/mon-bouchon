services:
  api:
    image: 'europe-west1-docker.pkg.dev/rognons/docker/mon-bouchon_api:latest'
    ports:
      - '8001:8000'
    environment:
      - PORT=8000
      - ENV=production
    volumes:
      - './api/src/data:/app/src/data:ro'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:8000/health'
      interval: 5s
      timeout: 1s
    restart: unless-stopped
  front:
    image: 'europe-west1-docker.pkg.dev/rognons/docker/mon-bouchon_front:latest'
    ports:
      - '3001:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost'
      interval: 5s
      timeout: 1s
    restart: unless-stopped
networks:
  default:
    name: mon-rognon
