services:
  # Site (Astro), avec rechargement automatique en développement
  front:
    build:
      context: ./front
      dockerfile: Dockerfile-dev
    ports:
      - "4321:4321"
    volumes:
      - ./front/src:/app/src
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:4321'
      interval: 5s
      timeout: 1s
    restart: unless-stopped

networks:
  default:
    name: mon-rognon
